set_climate_timer:
  target:
    entity:
      integration: tadox
      domain: climate
  fields:
    temperature:
      required: true
      example: 21
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
    until:
      example: "22:00:00"
      selector:
        time:
    duration:
      example: "02:00:00"
      selector:
        duration:
